services:
  db:
    image: postgres:16
    container_name: rzmedical_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rzmedical_db}
    # ⛔ Port 5432 intentionnellement non exposé sur internet
    # Le backend y accède via le réseau Docker interne (hostname: db)
    # Décommentez UNIQUEMENT en local pour Prisma Studio ou pgAdmin :
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rzmedical_backend_prod
    ports:
      # ⛔ Lié uniquement sur localhost — accès uniquement via Nginx, jamais depuis Internet
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      # Uploads persistés entre les redémarrages
      - uploads_prod:/app/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RZMedical}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: rzmedical_admin_prod
    ports:
      # ⛔ Lié uniquement sur localhost — accès uniquement via Nginx, jamais depuis Internet
      - "127.0.0.1:${ADMIN_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: rzmedical_web_prod
    ports:
      # ⛔ Lié uniquement sur localhost — accès uniquement via Nginx, jamais depuis Internet
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
    name: rzmedical_pgdata_prod
  uploads_prod:
    name: rzmedical_uploads_prod
